name: Bump Ghostty

on:
  schedule:
    - cron: "0 8 * * 1" # Weekly Monday 8am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for newer Ghostty release
        id: check
        run: |
          cd ghostty
          CURRENT_TAG=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD)
          echo "current=$CURRENT_TAG"

          git fetch --tags origin
          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname | head -1)
          echo "latest=$LATEST_TAG"

          echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already on latest: $CURRENT_TAG"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "new_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "Update available: $CURRENT_TAG -> $LATEST_TAG"
          fi

      # Stage the new gitlink so `just setup` (git submodule update) keeps it.
      - name: Update submodule to new tag
        id: bump
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git -C ghostty checkout ${{ steps.check.outputs.new_tag }}
          git add ghostty
          ZIG=$(sed -n 's/.*minimum_zig_version = "\(.*\)".*/\1/p' ghostty/build.zig.zon)
          echo "zig=$ZIG" >> "$GITHUB_OUTPUT"
          sed -i '' "s/^zig_version := .*/zig_version := \"$ZIG\"/" justfile

      - uses: taiki-e/install-action@v2
        if: steps.check.outputs.up_to_date == 'false'
        with:
          tool: just

      - name: Merge upstream binding changes
        if: steps.check.outputs.up_to_date == 'false'
        run: just merge-bindings ${{ steps.check.outputs.current }} ${{ steps.check.outputs.new_tag }}

      - name: Select Xcode 27.1
        if: steps.check.outputs.up_to_date == 'false'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Install zig ${{ steps.bump.outputs.zig }}
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          ZIG=${{ steps.bump.outputs.zig }}
          curl -sL https://ziglang.org/download/$ZIG/zig-aarch64-macos-$ZIG.tar.xz | tar xJ -C /tmp
          echo "/tmp/zig-aarch64-macos-$ZIG" >> "$GITHUB_PATH"

      - name: Install SwiftLint and xcodegen
        if: steps.check.outputs.up_to_date == 'false'
        run: brew install swiftlint xcodegen

      - name: Build GhosttyKit
        if: steps.check.outputs.up_to_date == 'false'
        run: just setup

      - name: Generate Xcode project
        if: steps.check.outputs.up_to_date == 'false'
        run: just generate

      - name: Verify build and tests
        if: steps.check.outputs.up_to_date == 'false'
        run: just check

      - name: Create pull request
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Bump ghostty to ${{ steps.check.outputs.new_tag }}"
          title: "Bump ghostty to ${{ steps.check.outputs.new_tag }}"
          body: |
            Automated bump of the ghostty submodule to [${{ steps.check.outputs.new_tag }}](https://github.com/ghostty-org/ghostty/releases/tag/${{ steps.check.outputs.new_tag }}).

            CI passed with this version.
          branch: bump-ghostty-${{ steps.check.outputs.new_tag }}
          delete-branch: true
