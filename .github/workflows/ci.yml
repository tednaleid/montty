name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: xcode-27
    # A hung test would otherwise sit until the six hour ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Zig cannot always parse the macOS SDK from a newer Xcode than the one
      # upstream Ghostty builds with, and then links without libSystem and fails
      # with undefined libc symbols. Pin the Xcode that ghostty/.github/workflows
      # selects for the submodule's release.
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v5
        with:
          path: |
            ghostty/macos/GhosttyKit.xcframework
            ghostty/zig-out/share/terminfo
            ghostty/zig-out/share/ghostty/themes
          key: ghosttykit-v4-${{ hashFiles('.git/modules/ghostty/HEAD') }}

      - name: Install zig
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          ZIG=$(just --evaluate zig_version)
          curl -sL https://ziglang.org/download/$ZIG/zig-aarch64-macos-$ZIG.tar.xz | tar xJ -C /tmp
          echo "/tmp/zig-aarch64-macos-$ZIG" >> "$GITHUB_PATH"

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: just setup

      - name: Create xcframework symlink
        run: ln -sfn ghostty/macos/GhosttyKit.xcframework GhosttyKit.xcframework

      - name: Install SwiftLint and xcodegen
        run: brew install swiftlint xcodegen

      - name: Generate Xcode project
        run: just generate

      - name: Check (test + lint + build)
        run: just check
