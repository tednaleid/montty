# Setup a fresh git worktree needs before `just check` will run.
#
# Both artifacts below are gitignored, so `wt` does not copy them, and neither
# survives a bare `git worktree add`:
#
#   GhosttyKit.xcframework is a symlink into the `ghostty` submodule, which git
#   worktrees do not initialise. Linking the main checkout's already-built
#   framework avoids a universal ReleaseFast zig build per worktree.
#
#   montty.xcodeproj is generated by xcodegen and is required by every build,
#   test, and lint recipe.

[[symlink]]
from = "ghostty/macos/GhosttyKit.xcframework"
to = "GhosttyKit.xcframework"

[[command]]
run = "just generate"
